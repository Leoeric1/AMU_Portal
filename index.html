<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0d2a45" />
  <meta name="description" content="阿牧网云统一数字内容入口" />
  <title>阿牧网云｜数字内容中心</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">AMU</div>
      <div>
        <p class="eyebrow">AMU DIGITAL PORTAL</p>
        <h1>阿牧网云数字内容中心</h1>
        <p class="lead">统一入口，连接展厅、文化、工厂与品牌内容。</p>
      </div>
    </header>

    <section class="grid" aria-label="内容入口">
      <a class="card card-primary" href="/exhibition/">
        <span class="tag">EXHIBITION</span>
        <h2>阿牧展厅</h2>
        <p>贵安总部展厅全景、空间设计与数字展示。</p>
        <span class="arrow">进入展厅 →</span>
      </a>

      <a class="card" href="/culture/">
        <span class="tag">CULTURE</span>
        <h2>企业文化手册</h2>
        <p>阿牧使命、价值观、行为准则与文化内容。</p>
        <span class="arrow">打开手册 →</span>
      </a>

      <div class="card card-muted" aria-disabled="true">
        <span class="tag">FACTORY</span>
        <h2>贵安生产智造中心</h2>
        <p>工厂、研发与生产智造内容入口。</p>
        <span class="status">筹备中</span>
      </div>

      <div class="card card-muted" aria-disabled="true">
        <span class="tag">EVENTS</span>
        <h2>展会与活动</h2>
        <p>数博会、行业展会、发布会及专题内容。</p>
        <span class="status">筹备中</span>
      </div>
    </section>

    <footer>
      <span>阿牧网云 · 以数字科技促产业发展</span>
      <span>AMU Network Cloud</span>
    </footer>
  </main>
</body>
</html>
